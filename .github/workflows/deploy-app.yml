name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Sync files to server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.next' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Install, build and restart
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            npm ci
            npm run db:push
            npm run build
            sudo systemctl restart proservice
          "

      - name: Deploy bot — env from secret, install deps, systemd service
        run: |
          cat > /tmp/bot.env <<'BOTENV'
          ${{ secrets.BOT_ENV }}
          BOTENV
          scp -P "${{ secrets.SSH_PORT || 22 }}" /tmp/bot.env "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/bot_administrator/.env"
          ssh -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            chmod 600 ${{ secrets.DEPLOY_PATH }}/bot_administrator/.env
            cd ${{ secrets.DEPLOY_PATH }}/bot_administrator
            npm ci
            sudo cp bot-administrator.service /etc/systemd/system/bot-administrator.service
            sudo systemctl daemon-reload
            sudo systemctl enable bot-administrator
            sudo systemctl restart bot-administrator
          "
